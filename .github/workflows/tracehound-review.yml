name: TraceHound review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions: {}

jobs:
  data:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    concurrency:
      group: tracehound-data-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Temporary live-check pin; restored afterwards.
      - uses: SunnyBagal/TraceHound/.github/actions/tracehound-review@1fa94d3760bfacb1108c3efcce6509bcd3a5d6d2
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          max-comments: '0'
          dry-run: 'false'
          data-branch: 'on'
