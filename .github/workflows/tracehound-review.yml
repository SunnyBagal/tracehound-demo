name: TraceHound review

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, closed]

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: tracehound-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  review:
    if: github.event_name == 'push' || (github.event.pull_request.head.repo.full_name == github.repository && !github.event.pull_request.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # Update this main-commit pin by hand after action changes.
      - uses: SunnyBagal/TraceHound/.github/actions/tracehound-review@ef533299295dfe1837db4311ac390026ab28c1fc
        with:
          nebius-api-key: ${{ secrets.NEBIUS_API_KEY }}
          max-comments: '0'
          dry-run: 'false'
          data-branch: 'on'
